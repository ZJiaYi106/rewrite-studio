services:
  rewrite-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rewrite-studio-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEB_HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:${HOST_PORT:-18080}:8000"
    volumes:
      - ./data/output:/app/output
      - ./data/temp:/app/temp
    mem_limit: 4g
    cpus: "4.0"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
